<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Violet&#x27;s Promise</title>
<meta name="description" content="Violet&#x27;s Promise">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
  :root {
    /* ZOOM: change this one number to make the logo bigger or smaller (pixels wide on a desktop screen). */
    --logo-width: 640px;
    --bg: #faefeb;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body {
    display: flex; align-items: center; justify-content: center;
    padding-bottom: 4vh; box-sizing: border-box;   /* tiny lift so it sits at the optical center */
  }
  img {
    width: min(var(--logo-width), 82vw); height: auto; display: block;
    user-select: none; -webkit-user-drag: none;
  }
</style>
</head>
<body>
  <img src="logo.png" alt="Violet&#x27;s Promise" draggable="false">
</body>
</html>
