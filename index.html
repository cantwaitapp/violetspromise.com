<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Violet's Promise</title>
<meta name="description" content="Violet's Promise">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
  :root {
    /* SIZE: logo width in pixels (520 = roughly 1.6 in tall next to the small cube). */
    --logo-width: 520px;
    --bg: #faefeb;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  main { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
  img { display: block; width: min(var(--logo-width), 82vw); height: auto; user-select: none; -webkit-user-drag: none; }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="Violet's Promise" width="1172" height="365" draggable="false">
</main>
</body>
</html>
